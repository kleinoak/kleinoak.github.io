<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Klein Oak Volleyball">
  <!--
    The "KO" mark from the site header (src/components/layout/Header.tsx): panther
    black tile, Klein Oak gold letters. The letterforms are paths, not <text>, so
    the icon renders identically everywhere — a favicon gets no webfont, and
    falling back to a system font would change the mark's shape.
  -->
  <rect width="64" height="64" rx="8" fill="#0d0d0d"/>
  <g fill="#f5b317">
    <path d="M10,18 h6 v11 l9,-11 h7 l-11,13 l12,15 h-7 l-10,-12 v12 h-6 z"/>
    <path fill-rule="evenodd" d="M42,18 h6 a6,6 0 0 1 6,6 v16 a6,6 0 0 1 -6,6 h-6 a6,6 0 0 1 -6,-6 v-16 a6,6 0 0 1 6,-6 z M45,24 a3,3 0 0 1 3,3 v10 a3,3 0 0 1 -3,3 a3,3 0 0 1 -3,-3 v-10 a3,3 0 0 1 3,-3 z"/>
  </g>
</svg>
