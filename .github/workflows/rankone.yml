name: Sync Rank One schedule

# Pull the four Rank One calendars into content/rankone.json.
#
# WHY THIS RUNS HERE AND NOT IN PRODUCTION
#
# The obvious home for this is kleinoak/kleinoak.github.io, since that is what
# serves the site. It cannot live there. `scripts/deploy-prod.sh` publishes by
# building a fresh commit from this repository's `main` and running
#
#     git push --force prod <commit>:main
#
# so anything committed inside the production repository — by a person or by a
# job like this one — is discarded by the next deploy. A sync job there would
# appear to work, and then silently lose its data the first time anybody
# published a content change.
#
# So it runs in the source repository, commits to `main`, and reaches production
# the same way every other change does. See PROJECT-DOCUMENTATION, "Keeping the
# schedule in sync", for the one consequence of that (production is as fresh as
# the last deploy, not as the last sync) and the two ways to close it.
on:
  schedule:
    # Times are Central during daylight saving (UTC-5), which covers the whole
    # volleyball season. GitHub cron is UTC and does not shift with the clock, so
    # from early November these each land an hour earlier in local terms.
    #
    # 11:00 UTC — 06:00 Central. Before the school run.
    - cron: "0 11 * * *"
    # 15:00 UTC — 10:00 Central. Catches a morning change to the day's fixtures.
    - cron: "0 15 * * *"
    # 04:00 UTC — 23:00 Central the evening before, after matches, when Rank One
    # has usually posted the night's scores.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Parse and report, but do not commit"
        type: boolean
        default: false

# The job commits, so it needs more than the repository's read-only default.
permissions:
  contents: write

# Never let the nightly and the morning run race each other into the same file.
concurrency:
  group: rankone-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      dataChanged: ${{ steps.fetch.outputs.dataChanged }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `dataChanged` is set by the script: yes when the games themselves differ,
      # no when only the checkedAt timestamp moved. Every run writes the file, so
      # the page can say when it last looked rather than only when it last found
      # something.
      - name: Fetch Rank One
        id: fetch
        run: |
          node scripts/fetch-rankone.mjs \
            ${{ inputs.dryRun && '--dry-run' || '' }} | tee /tmp/rankone.log

      # The site must still build with whatever was just written. Without this a
      # feed change that breaks a type or an assumption would be committed first
      # and discovered on the next unrelated push.
      - name: Validate and build
        if: ${{ !inputs.dryRun }}
        run: npm run build

      - name: Commit
        if: ${{ !inputs.dryRun }}
        run: |
          git config user.name  "rankone-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/rankone.json

          if git diff --cached --quiet; then
            echo "Nothing staged — the file is byte-identical, which should not happen."
            exit 0
          fi

          if [ "${{ steps.fetch.outputs.dataChanged }}" = "yes" ]; then
            SUBJECT="Sync schedule and results from Rank One"
          else
            SUBJECT="Rank One checked — no schedule changes"
          fi

          git commit -m "$SUBJECT

          Generated by .github/workflows/rankone.yml — see scripts/fetch-rankone.mjs.
          Venues, map links, per-game notes and newly posted scores only; the
          curated schedule in content/matches.json is never touched by this job.

          A 'no schedule changes' commit moves only checkedAt, which is what the
          schedule page reads to say when the feeds were last looked at."

          # Another run may have landed between checkout and now. Rebase rather
          # than fail: this file is generated, so the newest fetch wins.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rank One sync"
            echo
            echo '```'
            cat /tmp/rankone.log 2>/dev/null || echo "no output — the fetch step failed"
            echo '```'
            echo
            if [ "${{ steps.fetch.outputs.dataChanged }}" = "yes" ]; then
              echo "**The schedule data changed.**"
            else
              echo "No schedule changes — only the checked-at timestamp moved."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publish to production, so the page shows the last sync that *ran* rather
  # than the last one somebody happened to deploy. Without this the "last
  # checked" stamp goes stale within a day and reads as broken even though it
  # is accurate about the deployed build — a stamp nobody deploys is worse than
  # no stamp at all.
  #
  # It runs after EVERY successful sync, not only when the fixtures changed.
  # Gating on `dataChanged` was the first instinct and it is wrong for exactly
  # the reason the stamp exists: through a quiet week the page would keep
  # claiming Tuesday while the job had checked twenty times since. Production
  # history is explicitly a deploy artefact rather than a source of truth (see
  # scripts/deploy-prod.sh), so three force-pushes a day cost nothing that
  # matters.
  #
  # `environment: production` is load-bearing security, not decoration. This key
  # can force-push the live site, and content editors are repository
  # collaborators with Write access — so without an environment whose branch
  # policy is restricted to `main`, any collaborator could push a branch whose
  # workflow simply printed the secret.
  publish:
    needs: sync
    if: ${{ !inputs.dryRun }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # deploy-prod.sh builds a commit with `git commit-tree -p main`, and a
          # push whose parent is a shallow boundary is rejected outright.
          fetch-depth: 0

      - name: Publish to kleinoakvolleyball.com
        env:
          DEPLOY_IDENTITY: ${{ secrets.PROD_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_IDENTITY" ]; then
            echo "PROD_DEPLOY_KEY is not set — skipping the deploy."
            echo "The sync still committed; production updates on the next manual deploy."
            echo "### Deploy skipped — PROD_DEPLOY_KEY is not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_IDENTITY" > ~/.ssh/prod_id
          chmod 600 ~/.ssh/prod_id
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          # deploy-prod.sh is reused rather than reimplemented, so the tree that
          # reaches production is stripped by exactly the same code a person
          # runs locally. It expects a remote named `prod`.
          git config user.name  "rankone-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add prod git@github.com:kleinoak/kleinoak.github.io.git

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/prod_id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          sh scripts/deploy-prod.sh | tee /tmp/deploy.log

          {
            echo "### Published to production"
            echo
            echo '```'
            cat /tmp/deploy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Forget the identity file
        if: always()
        run: rm -f ~/.ssh/prod_id
