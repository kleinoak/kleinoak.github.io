name: Build and deploy site

# Every publish from the /admin editor is a commit on main, which lands here:
# the content is validated, the site is rebuilt, and GitHub Pages serves it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes deploy over each other; always ship the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Build static site
        env:
          # Set these as repository variables (Settings → Secrets and variables
          # → Actions → Variables) if the site is not on a custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
          NEXT_PUBLIC_GITHUB_OWNER: ${{ github.repository_owner }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.event.repository.name }}
          NEXT_PUBLIC_GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
